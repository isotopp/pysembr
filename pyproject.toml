[project]
name = "pysembr"
version = "1.0.0"
description = "Split lines in a natural language text according to sembr-inspired rules."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kristian Köhntopp", email = "kris-pysembr@koehntopp.de" }]

[project.scripts]
pysembr = "pysembr.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.10",
]
