[project]
name = "pysembr"
version = "2.2.0"
description = "Markdown-aware semantic line breaking."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "Kristian Köhntopp", email = "kris-pysembr@koehntopp.de" }]
dependencies = [
    "markdown-it-py==4.2.0",
    "mdit-py-plugins==0.6.1",
]

[project.scripts]
pysembr = "pysembr.cli:main"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.14.10",
    "ty>=0.0.84",
]

[build-system]
requires = ["uv_build>=0.9.27,<0.10"]
build-backend = "uv_build"
